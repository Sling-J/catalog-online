<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Витрина V5 — список с размерами</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F2FA}
.v5-btn{cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.v5-btn:active{transform:scale(.94)}
.v5-btn:focus-visible{outline:3px solid #3B2FD9;outline-offset:2px}
.v5-chips{overflow-x:auto;scrollbar-width:none}
.v5-chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 1700px; position: relative; overflow: hidden; font-family: 'Geologica', system-ui, sans-serif; color: #17133D; background: #F3F2FA">
<div aria-hidden="true" style="position: absolute; right: -150px; top: -140px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(124,108,255,.4), rgba(124,108,255,0) 68%)"></div>
<div aria-hidden="true" style="position: absolute; left: -160px; top: 520px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(255,122,182,.32), rgba(255,122,182,0) 68%)"></div>
<div aria-hidden="true" style="position: absolute; right: -160px; top: 1100px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(circle, rgba(94,230,176,.32), rgba(94,230,176,0) 68%)"></div>

<div style="position: relative; padding: 16px 12px 0">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
<div style="width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(140deg, #FF9CC8, #7C6CFF); color: #ffffff; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center">АK</div>
<div style="flex: 1"><div style="font-weight: 800; font-size: 17px">Айгерим Kids</div><div style="font-size: 12px; color: #4A4570">ТЦ «Мега» · <span style="color: #157A52; font-weight: 600">открыто до 20:00</span></div></div>
<div style="display: flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.8)">
<span style="width: 36px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6694" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg></span>
<span style="width: 36px; height: 32px; border-radius: 9px; background: #17133D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></span>
</div>
</div>

<div style="margin-top: 14px; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 16px; background: rgba(255,255,255,.85); border: 1px solid #ffffff; color: #6B6694; font-size: 15px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6694" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Поиск по каталогу</div>

<div class="v5-chips" style="display: flex; gap: 8px; margin-top: 12px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button class="v5-btn" type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button></sc-for>
</div>
<div style="margin: 14px 4px 0; font-size: 13px; color: #3A3672">Нажмите на размер — товар сразу попадёт в корзину</div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
<sc-for list="{{rows}}" as="p" hint-placeholder-count="7">
<article style="display: flex; gap: 12px; padding: 10px; border-radius: 24px; background: #ffffff; box-shadow: 0 8px 24px rgba(40,30,110,.07)">
<img src="{{p.img}}" alt="{{p.name}}" style="width: 100px; height: 124px; flex: none; border-radius: 18px; object-fit: cover; background: #EEECF8">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="font-weight: 600; font-size: 15px; line-height: 1.25">{{p.name}}</div>
<div style="font-weight: 800; font-size: 17px; margin-top: 3px; font-variant-numeric: tabular-nums">{{p.price}}</div>
<div style="font-size: 11px; font-weight: 600; color: #6B6694; margin-top: auto">{{p.sizeTitle}}</div>
<div role="group" aria-label="{{p.sizeTitle}}" style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px">
<sc-for list="{{p.sizes}}" as="z" hint-placeholder-count="4"><button class="v5-btn" type="button" onClick="{{z.pick}}" disabled="{{z.out}}" aria-label="{{z.aria}}" style="{{z.style}}">{{z.label}}</button></sc-for>
</div>
</div>
</article>
</sc-for>
</div>
<p style="text-align: center; margin: 16px 16px 0; font-size: 11px; color: #6E6993">Список: размеры и наличие видны без перехода в карточку. Жёлтая точка — осталось 1–2. Фото — Unsplash</p>
</div>

<sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 12px; right: 12px; top: 760px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; border-radius: 999px; background: rgba(23,19,61,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: #ffffff">
<div style="flex: 1; font-size: 13px"><div style="opacity: .75">{{cartLabel}}</div><div style="font-weight: 800; font-size: 15px">{{total}}</div></div>
<div style="padding: 12px 18px; border-radius: 999px; background: #FFD23F; color: #17133D; font-weight: 700; font-size: 14px; box-shadow: 0 4px 0 #C79A00">В корзину</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'all', cart: {} }; }
  renderVals() {
    var s = this.state, self = this, B = '/_blob/';
    var P = [
      [1, 'Куртка демисезонная', 'outer', 18900, '1260977f2c0c34a5b933572bb6e99e94', 'h', { '104': 3, '110': 1, '116': 4, '122': 0 }],
      [2, 'Платье трикотажное', 'dress', 9500, '7d0f77b8370d9af612d61812d7452e5f', 'h', { '104': 2, '110': 5, '116': 0, '122': 2 }],
      [3, 'Кроссовки на липучках', 'shoes', 14200, '04a201bc58d35022516d4467e49b7f41', 's', { '28': 0, '29': 2, '30': 1, '31': 3 }],
      [4, 'Шапка вязаная', 'acc', 4200, 'b7e066c9d74196dbd3a06f17035798be', 'c', { '50': 6, '52': 6, '54': 2 }],
      [5, 'Дождевик жёлтый', 'outer', 7900, 'a3bc2f157acffb785bd68c64b69fa957', 'h', { '104': 4, '110': 2, '116': 3 }],
      [6, 'Джинсовая куртка', 'outer', 12500, '8a58a9934844266efb16a8c4761e7f7b', 'h', { '110': 1, '116': 2, '122': 3, '128': 0 }],
      [7, 'Худи с капюшоном', 'tops', 8900, 'b10ce1436e13380c548fa804ef4347fd', 'h', { '116': 3, '122': 4, '128': 2 }],
      [8, 'Футболка хлопок', 'tops', 3500, '167257d6a7f8ad684c2d856ae3a11150', 'h', { '98': 5, '104': 7, '110': 6, '116': 4 }],
      [9, 'Платье летнее', 'dress', 8200, '7cb5296df170d7a0aca0d4bd8ec7cb9e', 'h', { '98': 1, '104': 3, '110': 0 }],
      [10, 'Кеды', 'shoes', 11800, '2ec542edaef6635ace484ac3c7ad1f4a', 's', { '26': 2, '27': 0, '28': 1 }],
      [11, 'Пальто шерстяное', 'outer', 24900, '4425d713fea616a795f8125f90d8aed0', 'h', { '110': 2, '116': 1, '122': 0 }]
    ];
    function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸'; }
    var CATS = [['all', 'Все'], ['outer', 'Верхняя одежда'], ['dress', 'Платья'], ['tops', 'Кофты'], ['shoes', 'Обувь'], ['acc', 'Аксессуары']];
    var cats = CATS.map(function (c) { var on = c[0] === s.cat; return { label: c[1], pressed: on ? 'true' : 'false', pick: function () { self.setState({ cat: c[0] }); }, style: 'flex: none; border: 0; border-radius: 999px; padding: 10px 16px; min-height: 42px; font: 600 14px Geologica, sans-serif; ' + (on ? 'background: #17133D; color: #ffffff; box-shadow: 0 3px 0 #0B0A26;' : 'background: rgba(255,255,255,.85); color: #17133D;') }; });
    var count = 0, sum = 0;
    for (var key in s.cart) { var parts = key.split('|'); var pp = P.filter(function (x) { return String(x[0]) === parts[0]; })[0]; count += s.cart[key]; sum += s.cart[key] * pp[3]; }
    var rows = P.filter(function (p) { return s.cat === 'all' || p[2] === s.cat; }).slice(0, 8).map(function (p) {
      return {
        name: p[1], price: fmt(p[3]), img: B + p[4],
        sizeTitle: p[5] === 's' ? 'Размер обуви' : (p[5] === 'c' ? 'Обхват головы' : 'Рост'),
        sizes: Object.keys(p[6]).map(function (z) {
          var n = p[6][z], k = p[0] + '|' + z, q = s.cart[k] || 0, out = n === 0 || q >= n;
          var st = 'position: relative; min-width: 46px; height: 38px; padding: 0 10px; border-radius: 12px; font: 600 14px Geologica, sans-serif; border: 0; ';
          if (n === 0) st += 'background: #F3F1FA; color: #9A95B8; text-decoration: line-through; cursor: default;';
          else if (q > 0) st += 'background: #5EE6B0; color: #0B3A28; box-shadow: 0 3px 0 #26B985;';
          else st += 'background: #EEECF8; color: #17133D;' + (n <= 2 ? ' box-shadow: inset 0 -3px 0 #FFB238;' : '');
          return {
            label: q > 0 ? z + ' · ' + q : z, out: out, style: st,
            aria: n === 0 ? 'Размер ' + z + ' — нет в наличии' : 'Добавить размер ' + z + (n <= 2 ? ', осталось ' + n : ''),
            pick: function () { if (out) return; var c = Object.assign({}, self.state.cart); c[k] = (c[k] || 0) + 1; self.setState({ cart: c }); }
          };
        })
      };
    });
    function plural(n) { var a = n % 10, b = n % 100; return n + ' ' + (a === 1 && b !== 11 ? 'товар' : (a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'товара' : 'товаров')); }
    return { cats: cats, rows: rows, hasCart: count > 0, cartLabel: plural(count), total: fmt(sum) };
  }
}
</script>
</body>
</html>
