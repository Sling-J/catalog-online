<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Витрина V2 — классика</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
.v2-btn{cursor:pointer}
.v2-btn:focus-visible{outline:2px solid #1D1B4B;outline-offset:2px}
.v2-tabs{overflow-x:auto;scrollbar-width:none}
.v2-tabs::-webkit-scrollbar{display:none}
.v2-heart{transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.v2-heart:active{transform:scale(.85)}
</style>
</helmet>
<div style="width: 390px; height: 1700px; position: relative; overflow: hidden; font-family: 'Geologica', system-ui, sans-serif; color: #16151F; background: #FFFFFF">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 8px">
<button class="v2-btn" type="button" aria-label="Меню" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16151F" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></button>
<div style="text-align: center"><div style="font-weight: 800; font-size: 17px; letter-spacing: 0.12em">АЙГЕРИМ KIDS</div><div style="font-size: 11px; color: #6B6A78; margin-top: 2px">Шымкент · ТЦ «Мега»</div></div>
<button class="v2-btn" type="button" aria-label="Корзина" style="position: relative; width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16151F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg><sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 999px; background: #3B2FD9; color: #ffffff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{cart}}</span></sc-if></button>
</div>

<div style="margin: 4px 16px 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; background: #F4F4F7; color: #6B6A78; font-size: 15px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6A78" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Найти в магазине</div>

<div class="v2-tabs" style="display: flex; gap: 22px; padding: 16px 16px 0; border-bottom: 1px solid #EDEDF2">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button class="v2-btn" type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button></sc-for>
</div>

<div style="display: flex; gap: 8px; padding: 12px 16px 0">
<button class="v2-btn" type="button" style="flex: 1; height: 40px; border: 1px solid #E2E2EA; border-radius: 10px; background: #ffffff; font: 500 14px Geologica, sans-serif; color: #16151F; display: flex; align-items: center; justify-content: center; gap: 6px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16151F" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Фильтры</button>
<button class="v2-btn" type="button" style="flex: 1; height: 40px; border: 1px solid #E2E2EA; border-radius: 10px; background: #ffffff; font: 500 14px Geologica, sans-serif; color: #16151F">По новизне</button>
</div>
<div style="padding: 10px 16px 0; font-size: 13px; color: #6B6A78">{{count}}</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 10px; padding: 12px 16px 0">
<sc-for list="{{grid}}" as="p" hint-placeholder-count="8">
<article>
<div style="position: relative">
<img src="{{p.img}}" alt="{{p.name}}" style="display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; background: #F4F4F7">
<button class="v2-btn v2-heart" type="button" aria-label="В избранное" style="position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16151F" stroke-width="1.8"><path d="M12 20s-7-4.3-8.9-8.6C1.8 8.3 3.7 5 7 5c1.9 0 3.3 1 4 2.3C11.7 6 13.1 5 15 5c3.3 0 5.2 3.3 3.9 6.4C19 15.7 12 20 12 20z"></path></svg></button>
<sc-if value="{{p.few}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 6px; bottom: 6px; padding: 4px 8px; border-radius: 6px; background: #ffffff; font-size: 11px; font-weight: 600; color: #A35A00">Осталось мало</span></sc-if>
</div>
<div style="font-weight: 700; font-size: 15px; margin-top: 8px; font-variant-numeric: tabular-nums">{{p.price}}</div>
<div style="font-size: 13px; line-height: 1.3; color: #3D3C4A; margin-top: 2px">{{p.name}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px">
<sc-for list="{{p.sizes}}" as="z" hint-placeholder-count="4"><span style="{{z.style}}">{{z.label}}</span></sc-for>
</div>
<button class="v2-btn" type="button" onClick="{{p.add}}" style="width: 100%; margin-top: 8px; height: 36px; border: 1px solid #16151F; border-radius: 10px; background: #ffffff; font: 600 13px Geologica, sans-serif; color: #16151F">В корзину</button>
</article>
</sc-for>
</div>
<p style="text-align: center; margin: 22px 16px 0; font-size: 11px; color: #8A8996">Классический магазин: белый фон, тонкие линии, акцент только в корзине. Фото — Unsplash</p>

<nav aria-label="Нижнее меню" style="position: absolute; left: 0; right: 0; top: 774px; height: 70px; display: flex; background: rgba(255,255,255,.96); border-top: 1px solid #EDEDF2">
<button class="v2-btn" type="button" aria-current="page" style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 11px Geologica, sans-serif; color: #16151F"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16151F" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Каталог</button>
<button class="v2-btn" type="button" style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 500 11px Geologica, sans-serif; color: #6B6A78"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6A78" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Поиск</button>
<button class="v2-btn" type="button" style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 500 11px Geologica, sans-serif; color: #6B6A78"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>Корзина</button>
<button class="v2-btn" type="button" style="flex: 1; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 500 11px Geologica, sans-serif; color: #6B6A78"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6B6A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l1.5-5h13L20 10"></path><path d="M5 10v9h14v-9"></path><path d="M10 19v-5h4v5"></path></svg>Магазин</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'all', cart: 0 }; }
  renderVals() {
    var s = this.state, self = this, B = '/_blob/';
    var P = [
      ['Куртка демисезонная', 'outer', 18900, '1260977f2c0c34a5b933572bb6e99e94', { '104': 3, '110': 1, '116': 4, '122': 0 }],
      ['Платье трикотажное', 'dress', 9500, '7d0f77b8370d9af612d61812d7452e5f', { '104': 2, '110': 5, '116': 0, '122': 2 }],
      ['Кроссовки на липучках', 'shoes', 14200, '04a201bc58d35022516d4467e49b7f41', { '28': 0, '29': 2, '30': 1, '31': 3 }],
      ['Шапка вязаная', 'acc', 4200, 'b7e066c9d74196dbd3a06f17035798be', { '50': 6, '52': 6, '54': 2 }],
      ['Дождевик жёлтый', 'outer', 7900, 'a3bc2f157acffb785bd68c64b69fa957', { '104': 4, '110': 2, '116': 3 }],
      ['Джинсовая куртка', 'outer', 12500, '8a58a9934844266efb16a8c4761e7f7b', { '110': 1, '116': 2, '122': 3, '128': 0 }],
      ['Худи с капюшоном', 'tops', 8900, 'b10ce1436e13380c548fa804ef4347fd', { '116': 3, '122': 4, '128': 2 }],
      ['Футболка хлопок', 'tops', 3500, '167257d6a7f8ad684c2d856ae3a11150', { '98': 5, '104': 7, '110': 6, '116': 4 }],
      ['Платье летнее', 'dress', 8200, '7cb5296df170d7a0aca0d4bd8ec7cb9e', { '98': 1, '104': 3, '110': 0 }],
      ['Кеды', 'shoes', 11800, '2ec542edaef6635ace484ac3c7ad1f4a', { '26': 2, '27': 0, '28': 1 }],
      ['Пальто шерстяное', 'outer', 24900, '4425d713fea616a795f8125f90d8aed0', { '110': 2, '116': 1, '122': 0 }],
      ['Кардиган серый', 'tops', 10400, '93fc374092f690eb46aa0b0cf74bcce4', { '104': 2, '110': 3, '116': 1 }]
    ];
    function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸'; }
    var CATS = [['all', 'Все'], ['outer', 'Верхняя одежда'], ['dress', 'Платья'], ['tops', 'Кофты'], ['shoes', 'Обувь'], ['acc', 'Аксессуары']];
    var cats = CATS.map(function (c) { var on = c[0] === s.cat; return { label: c[1], pressed: on ? 'true' : 'false', pick: function () { self.setState({ cat: c[0] }); }, style: 'flex: none; border: 0; background: transparent; padding: 6px 0 12px; font: ' + (on ? '700' : '500') + ' 15px Geologica, sans-serif; color: ' + (on ? '#16151F; box-shadow: inset 0 -2px 0 #16151F;' : '#6B6A78;') }; });
    var list = P.filter(function (p) { return s.cat === 'all' || p[1] === s.cat; });
    var grid = list.slice(0, 8).map(function (p) {
      var t = 0; for (var k in p[4]) t += p[4][k];
      return {
        name: p[0], price: fmt(p[2]), img: B + p[3], few: t <= 4,
        sizes: Object.keys(p[4]).map(function (z) { var out = p[4][z] === 0; return { label: z, style: 'font-size: 12px; font-weight: 500; ' + (out ? 'color: #B4B3C0; text-decoration: line-through;' : 'color: #3D3C4A;') }; }),
        add: function () { self.setState({ cart: self.state.cart + 1 }); }
      };
    });
    return { cats: cats, grid: grid, count: list.length + ' товаров', hasCart: s.cart > 0, cart: s.cart };
  }
}
</script>
</body>
</html>
